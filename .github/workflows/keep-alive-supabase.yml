name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS -X GET "${SUPABASE_URL}/rest/v1/venues?select=id&limit=1" \
            -H "apikey: ${SUPABASE_API_KEY}" > /dev/null
          echo "Supabase successfully pinged."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep workflow active
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          if [ "$AGE_DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep workflow active [skip ci]"
            git push
          else
            echo "Last commit was ${AGE_DAYS} days ago (< 50). No keep-alive commit needed."
          fi
