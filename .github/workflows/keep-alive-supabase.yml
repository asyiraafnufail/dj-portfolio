name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X GET "${SUPABASE_URL}/rest/v1/venues?select=id&limit=1" \
            -H "apikey: ${SUPABASE_API_KEY}" > /dev/null
          echo "Supabase successfully pinged."

      - name: Keep workflow active
        uses: gautamkrishnar/keepalive-workflow@v2
